manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.b1
kind: tool_provider
version: 0.1.0
release_stage: active
billing_mode: free
display_name: B1 (Site.pro Accounting)
description: 'Connect workflows to B1 (Site.pro Accounting), the Lithuanian online
  accounting software, through its API. Everyday steps find or create clients and
  items, create sales and purchase invoices with their lines, record payments for
  sales checked for repeats and generate reports; amounts are taken as plain decimals
  and converted where the API expects them multiplied.


  Every one of the 600 documented operations has its own step: clients, items and
  reference data, sales, purchases and stock, bank and cash, documents, general ledger,
  personnel, salary, production, long-term assets, e-commerce and shop, with cursor
  or page paging and filters, files and every report. Deletions take explicit IDs
  only, and irreversible accounting actions say what they change. Each connection
  is one company, reached with its API key.'
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-finance-b1/issues
  website_url: https://github.com/Flow-Steward/ext-finance-b1
listing:
  category: finance
  tags:
  - b1
  - site-pro
  - accounting
  - lithuania
  - invoices
  - inventory
  - payments
  summary: Read and write B1 (Site.pro Accounting) clients, items, sales, purchases,
    payments, stock and reports.
  categories:
  - finance
  - inventory
  - sales
  setup_summary: "Create an API key under Settings \u2192 Integrations \u2192 API\
    \ simplified in Site.pro Accounting, add it to a project connection and run the\
    \ connection test."
features:
- tool
- action
required_scopes:
- extension:invoke
- artifact:read
- artifact:write
machine_auth:
  service_account_key: svc_ext_b1
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
account_scope:
  scope_type: project
  description: Each B1 (Site.pro Accounting) company and API key is a project connection.
    A project may hold several, for example one per company.
egress:
  hosts:
  - site.pro
