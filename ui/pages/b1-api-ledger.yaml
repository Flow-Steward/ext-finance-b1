- component_id: steps_general_ledger_cards
  type: markdown
  title: General ledger cards
  body: |
    ### Create a card

    How to create a BZ General Ledger posting Call POST /general-ledger-cards/cards/create with a date and required number. Save the returned data.id as the document's generalLedgerId . This creates a header without posting lines; the document type is always BZ . Call POST /general-ledger-cards/items/create with the first detail and a primary object. Use opposite D / K sides and the same exchangeRateId for both lines. The returned data.id is the detail ID. For each additional detail, call the same items/create endpoint with the document ID and omit primary or pass null. The primary amount is reca…. Running the step again can create the record twice.

    Action id `general_ledger_cards_cards_create` · changes data · Site.pro Accounting: `general-ledger-cards/cards/create`

    **Inputs**

    - `date` (text): Document date. Format: yyyy-MM-dd .
    - `number` (text): Document number. Must not be empty.
    - `items` (list, optional): Non-empty list of detail objects to post atomically with the header.
    - `items[]` (decimal, optional): .clientId] Required detail client ID.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Create a general ledger card item

    Creates a non-primary detail item and its matching primary item. The first item request must include primary ; later requests may omit it or pass null. See the step by step posting guide on cards/create. Running the step again can create the record twice.

    Action id `general_ledger_cards_items_create` · changes data · Site.pro Accounting: `general-ledger-cards/items/create`

    **Inputs**

    - `generalLedgerId` (decimal): General Ledger ID.
    - `clientId` (decimal): Client ID.
    - `typeId` (text): Document type. Possible values: K , D .
    - `correspondenceAccountId` (decimal): Correspondence account ID.
    - `sum` (decimal): Precision 2.
    - `sumInBaseCurrency` (decimal, optional): Amount in the company's base currency, precision 2. When supplied, must match the calculated amount.
    - `exchangeRateId` (decimal): Exchange rate ID.
    - `isPrimary` (yes/no, optional): Must be false when supplied.
    - `primary` (record, optional): Required on the first item request; omit or pass null after a primary item exists.
    - `note` (text, optional): Additional note.
    - `coverId` (decimal, optional): Existing ledger item ID in this company.
    - `costCenterId` (decimal, optional): Existing cost center ID in this company.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

    ### List cards

    Lists documents of every type through the existing GeneralLedgersProvider. Only BZ documents can be changed through this module's write actions.

    Action id `general_ledger_cards_cards_list` · reads only · Site.pro Accounting: `general-ledger-cards/cards/list`

    **Inputs**

    - `rows` (one of 10, 20, 30, 50, 100, 200, …, optional): How many records to return. Default 100.
    - `page` (whole number, optional): The page to read, from 1.
    - `sidx` (one of additionId, advanceId, bankTransactionId, bankTransactionItemId, bundleId, calculationErrorId, …, optional): The field to sort by.
    - `sord` (one of asc, desc, optional): asc or desc.
    - `filters` (list, optional): Rules, all of which must hold: field, op (eq, ne, lt, le, gt, ge, bw, bn, in, ni, ew, en, cn, nc, nu, nn) and data.

    **Results**

    - `items` (list): The records of this page.
    - `count` (whole number): How many records this page holds.
    - `page` (whole number): This page's number.
    - `pages` (whole number): How many pages there are.
    - `records` (whole number): How many records match.
    - `next_cursor` (text): Pass it as cursor to read on; null at the end.
    - `has_more` (yes/no): True when more records follow (cursor mode).
    - `warnings` (list): What the step could not do fully or what to check.

    ### List general ledger card items

    Lists items of every document type through the existing GeneralLedgerItemsProvider, including primary BZ lines. Write actions in this module accept BZ documents only.

    Action id `general_ledger_cards_items_list` · reads only · Site.pro Accounting: `general-ledger-cards/items/list`

