    ### Create a certificate of incapacity

    Create a certificate of incapacity in Site.pro Accounting. Running the step again can create the record twice.

    Action id `document_certificate_of_incapacities_create` · changes data · Site.pro Accounting: `document/certificate-of-incapacities/create`

    **Inputs**

    - `issueDate` (text): Document issue date. Format: yyyy-MM-dd
    - `employeeId` (decimal): Employee ID in the Site.pro system.
    - `dateFrom` (text): Document valid from date. Format: yyyy-MM-dd
    - `dateUntil` (text): Document valid until date. Format: yyyy-MM-dd
    - `series` (text): Document series.
    - `number` (text): Document number.
    - `reasonId` (decimal): Reason ID. Possible values: 1 - Sickness, 2 - Care, 3 - Epidemic, 4 - Accident at home, 5 - Accident on route, 6 - Occupational disease, 7 - Prosthetics, 8 - Donation, 9 - Pregnancy and childbirth lea
    - `comment` (text, optional): Additional comments.
    - `isExtension` (yes/no, optional): Whenever is an extension.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Create an agreement

    Create agreement. Running the step again can create the record twice.

    Action id `document_agreements_create` · changes data · Site.pro Accounting: `document/agreements/create`

    **Inputs**

    - `agreementDate` (text): Agreement date. Format: yyyy-MM-dd .
    - `parentId` (decimal, optional): Parent ID in the Site.pro system. Specify if you are trying to add annex to the agreement.
    - `number` (text): Agreement/annex number.
    - `internalNumber` (text, optional): Internal number.
    - `source` (decimal): Source. 1 - Company, 2 - client.
    - `typeId` (decimal, optional): Type ID in the Site.pro system.
    - `validFrom` (text, optional): Valid from. Format: yyyy-MM-dd .
    - `validUntil` (text, optional): Valid until. Format: yyyy-MM-dd .
    - `clientId` (decimal): Client's ID in the Site.pro system.
    - `needToExtend` (yes/no, optional): Whenever to need to extend.
    - `comment` (text): Comment.
    - `notes` (text): Notes.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

