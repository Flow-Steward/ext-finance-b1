    **Irreversible actions.** Each changes the accounting in a way the step cannot undo; its description says what changes.

    ### Generate a declaration file (FFData)

    Generates a declaration .ffdata (XML) file synchronously and returns it as an attachment. Validation matches the UI form at declaration/generations . Unlike the UI, this endpoint does not queue a background task — the file bytes are returned in the HTTP response body. Generates the declaration from the company's accounting data for the period; Site.pro Accounting may record the generation, and the step cannot undo it.

    Action id `declaration_generations_generate_ffdata` · changes data · Site.pro Accounting: `declaration/generations/generate-ffdata`

    **Inputs**

    - `templateId` (whole number): Declaration type ID. 6 - FR0600 (requires dateFrom, dateTill), 7 - GPM312 (requires year; optional addCurrentMonth, addPreviousMonth), 8 - GPM313 (requires year, month — one calendar month), 9 - FR056
    - `dateFrom` (text, optional): Start date (inclusive), format: yyyy-MM-dd . Required for FR0600/FR0600V3. For FR0564/GPM313 may replace year+month when it is an exact calendar month. For GPM312 may replace year when dateFrom is YYY
    - `dateTill` (text, optional): End date (inclusive), format: yyyy-MM-dd . Required for FR0600/FR0600V3. For monthly forms must be the last day of the same month when used instead of year+month. For GPM312 may be YYYY-01-01 or YYYY-
    - `year` (whole number, optional): Year. Required for GPM312/GPM313/FR0564 when not derived from dates.
    - `month` (whole number, optional): Month. Required for GPM313/FR0564 when not derived from dates.
    - `addCurrentMonth` (yes/no, optional): GPM312 only: include December of the selected year. Defaults to true (same as UI) when omitted.
    - `addPreviousMonth` (yes/no, optional): GPM312 only: include December of the previous year. Defaults to false when omitted.
    - `source` (yes/no, optional): FR0564 only: generate from the sales register (including credit invoices).

    **Results**

    - `file` (file): The file, as a workflow file.
    - `file_name` (text): Its file name.
    - `mime_type` (text): Its type.
    - `size_bytes` (whole number): Its size.
    - `warnings` (list): What the step could not do fully or what to check.
