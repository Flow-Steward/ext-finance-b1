    ### Settle general ledger rows

    Settles (covers) selected open ledger rows — same action as UI Settle on report/mass-settlement ( smart-settle-save ). Pass one or more groups of existing settlement row IDs (general ledger items ids from the mass-settlement report). Each group is settled together and must contain both debit ( D ) and credit ( K ) sides. A group may not contain more than one debit and more than one credit at the same time (one-to-many or many-to-one only). Settles the given open general ledger rows against each other, so they no longer show as open; the step cannot undo it.

