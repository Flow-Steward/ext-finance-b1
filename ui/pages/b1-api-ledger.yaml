    ### Create an insurance

    Create an insurance in Site.pro Accounting. Running the step again can create the record twice.

    Action id `document_insurances_create` · changes data · Site.pro Accounting: `document/insurances/create`

    **Inputs**

    - `insuranceTypeId` (decimal): reference insurance type ID in the Site.pro system.
    - `seriesLT` (text, optional): LT series of insurance.
    - `numberLT` (text): LT number of insurance. At list one numberLT or numberMOT must be filled up.
    - `seriesMOT` (text, optional): MOT series of insurance.
    - `numberMOT` (text): MOT number of insurance. At list one numberLT or numberMOT must be filled up.
    - `insuranceDate` (text): insurance record date in Site.pro system.
    - `insuranceBeginDate` (text): insurance begin date.
    - `insuranceEndDate` (text): insurance end date.
    - `insuranceInstitutionId` (decimal): reference insurance institution ID in the Site.pro system.
    - `insurerId` (decimal): reference insurer ID in the Site.pro system.
    - `paymentAmount` (decimal): payment amount.
    - `insuranceAmount` (decimal, optional): insurance amount.
    - `itemId` (decimal): reference to item ID in reference book of Site.pro system.
    - `debitCorrespondentAccountId` (decimal): reference to debit correspondence account ID in Site.pro system.
    - `creditCorrespondentAccountId` (decimal): reference to credit correspondence account ID in Site.pro system.
    - `notes` (text, optional): Additional notes.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

