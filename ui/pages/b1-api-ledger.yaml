    - `warnings` (list): What the step could not do fully or what to check.

    ### Update a card

    Updates a BZ document. If primary.exchangeRateId changes, all surviving detail lines are recalculated with the new rate in the same transaction. The update fails if any detail retains another rate.

    Action id `general_ledger_cards_cards_update` · changes data · Site.pro Accounting: `general-ledger-cards/cards/update`

