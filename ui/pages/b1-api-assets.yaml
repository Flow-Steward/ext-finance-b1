    ### Upload a long term asset file

    Attach file to a long-term asset. Warning: before uploading files make sure file storage is enabled in company/settings.

    Action id `long_term_asset_long_term_asset_files_create` · changes data · Site.pro Accounting: `long-term-asset/long-term-asset-files/create`

    **Inputs**

    - `recordId` (whole number): Long-term asset ID in the Site.pro system.
    - `fileName` (text): File name (include the extension, e.g. file.pdf ).
    - `file` (file): A workflow file, up to 8 MB.
    - `content_type` (text, optional): The file's MIME type, for example application/pdf. Default application/octet-stream.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

    **Deletions.** Only the IDs given are deleted, at most 50 per run; nothing deleted can be restored by a step.

    ### Delete long term asset files

    Delete long term asset files in Site.pro Accounting: only the one record its inputs name. Deletion cannot be undone.

    Action id `long_term_asset_long_term_asset_files_delete` · changes data · Site.pro Accounting: `long-term-asset/long-term-asset-files/delete`

    **Inputs**

    - `id` (whole number): Long-term asset file ID in the Site.pro system.

    **Results**

    - `sent_ids` (list): The IDs sent for deletion (each an ID or a record of IDs).
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.
