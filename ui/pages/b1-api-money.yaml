    ### Create a bank transaction

    Create a bank transaction. Running the step again can create the record twice.

    Action id `bank_transactions_create` · changes data · Site.pro Accounting: `bank/transactions/create`

    **Inputs**

    - `accountingBankId` (decimal): Accounting bank ID in B1.
    - `number` (text): Transfer number.
    - `date` (text): Transfer date. Format: yyyy-MM-dd
    - `initialClientId` (decimal): Bank client ID.
    - `clientId` (decimal): Client ID.
    - `creditDebitIndicator` (text): Bank direction: 'D' (Debit) = incoming; 'K' (Credit) = outgoing.
    - `exchangeRateId` (decimal): Exchange rate ID.
    - `details` (text, optional): Purpose of payment.
    - `note` (text, optional): Additional note.
    - `correspondenceAccountId` (decimal): Correspondence account ID.
    - `isLocked` (yes/no, optional): Is document locked.
    - `referenceNumber` (text, optional): Reference number.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

