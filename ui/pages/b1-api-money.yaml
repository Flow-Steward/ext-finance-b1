- component_id: steps_shop
  type: markdown
  title: Shop
  body: |
    ### Add a shop order

    This endpoint simplifies integration between Site.pro and Site.pro e-shop plugins. In most cases you should ignore this endpoint and use directly warehouse/sale endpoint to create invoices/documents. Adds order from the shop to B1. Shop must be properly configured in the Site.pro system. Pass the optional payment object to create a bank payment together with the order. This is the primary API method for recording payments from custom shop integrations. For built-in marketplace connectors without automatic payment import (Verskis, Pigu, Varle), use this endpoint or bank/sale-invoice/payment af…. Running the step again can create the record twice.

    Action id `shop_orders_add` · changes data · Site.pro Accounting: `shop/orders/add`

    **Inputs**

    - `prefix` (text): Shop identity. Each shop should have its own unique code.
    - `orderId` (decimal): The order ID in shop system.
    - `orderDate` (text): The order date. Format: yyyy-MM-dd .
    - `orderNo` (text): The order number.
    - `currency` (text): The order currency code (ISO 4217 standard), see here for a list of possible values. Example: EUR.
    - `shippingAmount` (decimal, optional): The order shipping amount with VAT multiplied by 100 . Example: 5,0 × 100 = 500. Give the plain amount; the step sends it multiplied by 100.
    - `discount` (decimal): The order discount sum with VAT multiplied by 100 . Example: 10,1 × 100 = 1010. Give the plain amount; the step sends it multiplied by 100.
    - `gift` (decimal, optional): The order gift sum with VAT multiplied by 100 . Example: 1,1 × 100 = 110. Give the plain amount; the step sends it multiplied by 100.
    - `total` (decimal): The order total sum with VAT, discount and shipping amount (in other words what client pays) multiplied by 100 . Example: 500,10 × 100 = 50010. Give the plain amount; the step sends it multiplied by 1
    - `orderEmail` (text, optional): The buyers email address.
    - `vatRate` (decimal, optional): The order VAT rate (%). The value must exist in B1 shop config.
    - `writeOff` (decimal, optional): Whenever to do the product write-off. 1 : yes, 0 : no.
    - `forceSalesOperationTypeId` (decimal, optional): Sale operation type ID. if it is passed B1 use it instead of preconfigured in API settings.
    - `billing` (record): Billing information.
    - `delivery` (record): Delivery information.
    - `payer` (record, optional): Payer information.
    - `payment` (record, optional): Payment information. When provided, a bank payment record is created and linked to the sale invoice.
    - `items` (list): List of items (Array of Objects).

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Get a shop UPD invoice PDF

    Get PDF invoice from B1.

    Action id `shop_invoices_get_upd` · reads only · Site.pro Accounting: `shop/invoices/get-upd`

    **Inputs**

    - `prefix` (text): Shop identity.
    - `orderId` (decimal): The order ID in shop system.
    - `language` (text, optional): The language code, available values are: lt,en,ru . For VAT payer ee and lv also available

    **Results**

    - `file` (file): The file, as a workflow file.
    - `file_name` (text): Its file name.
    - `mime_type` (text): Its type.
    - `size_bytes` (whole number): Its size.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Get a shop delivery-acceptance act

    Get PDF delivery-acceptance act from B1.

    Action id `shop_delivery_acceptance_acts_get` · reads only · Site.pro Accounting: `shop/delivery-acceptance-acts/get`

    **Inputs**

    - `prefix` (text): Shop identity.
    - `orderId` (decimal): The order ID in shop system.
    - `languageId` (decimal): Language ID to use when generating the act. Possible values: 1 - LT, 3 - RU.

    **Results**

    - `file` (file): The file, as a workflow file.
    - `file_name` (text): Its file name.
    - `mime_type` (text): Its type.
    - `size_bytes` (whole number): Its size.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Get a shop invoice PDF

    Get PDF invoice from B1.

    Action id `shop_invoices_get` · reads only · Site.pro Accounting: `shop/invoices/get`

    **Inputs**

    - `prefix` (text): Shop identity.
    - `orderId` (decimal): The order ID in shop system (order number in site.pro).
    - `language` (text, optional): The language code, available values are: lt,en,ru . For VAT payer ee and lv also available
    - `templateId` (decimal, optional): The invoice template ID. Possible values: 1 for Invoice with VAT 2 for Invoice without VAT 3 for Invoice with VAT and English language (only for lt) 4 for Invoice with VAT and Russian language (only f

    **Results**

    - `file` (file): The file, as a workflow file.
    - `file_name` (text): Its file name.
    - `mime_type` (text): Its type.
    - `size_bytes` (whole number): Its size.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Get a shop product file

    Gets specified shop product. Depending on shop config in B1 response can return no product or service. This API point requires more resources from the server than fetching product quantity. So it's recommended to run this point less often than fetching product quantity. Shop must be properly configured in the Site.pro system.

    Action id `shop_products_get` · reads only · Site.pro Accounting: `shop/products/get`

    **Inputs**

    - `id` (decimal): Product/service ID in the Site.pro system.

    **Results**

    - `file` (file): The file, as a workflow file.
    - `file_name` (text): Its file name.
    - `mime_type` (text): Its type.
    - `size_bytes` (whole number): Its size.
    - `warnings` (list): What the step could not do fully or what to check.

    ### List products

    Lists available products for sync with shop. Use page and rows for standard list pagination ( page , pages , records , data , code ). Without page / rows , the legacy lid / lmod flow applies (up to 100 items per response). Depending on shop config in Site.pro system various products or services are returned. This API point requires more resources from the server than fetching product quantities. So it is recommended to run this point less often than fetching product quantities. Shop must be properly configured in the Site.pro system.

    Action id `shop_products_list` · reads only · Site.pro Accounting: `shop/products/list`

    **Inputs**

    - `rows` (one of 10, 20, 30, 50, 100, 200, …, optional): How many records to return. Default 100.
    - `page` (whole number, optional): The page to read, from 1.
    - `sidx` (one of barcode, canBeCounted, code, id, name, priceWithVat, …, optional): The field to sort by.
    - `sord` (one of asc, desc, optional): asc or desc.
    - `filters` (list, optional): Rules, all of which must hold: field, op (eq, ne, lt, le, gt, ge, bw, bn, in, ni, ew, en, cn, nc, nu, nn) and data.
    - `lid` (decimal, optional): Last known ID. Used together with pagination. See Last known ID example for more information.
    - `lmod` (text, optional): Last modification date. Format: yyyy-MM-dd . Returns records that were modified after the specified date. See Last known ID example to find out how the pagination works.

    **Results**

    - `items` (list): The records of this page.
    - `count` (whole number): How many records this page holds.
    - `page` (whole number): This page's number.
    - `pages` (whole number): How many pages there are.
    - `records` (whole number): How many records match.
    - `next_cursor` (text): Pass it as cursor to read on; null at the end.
    - `has_more` (yes/no): True when more records follow (cursor mode).
    - `warnings` (list): What the step could not do fully or what to check.
