  body: |
    ### Add a cash register sale

    Adds sale from the cash register to B1. Running the step again can create the record twice.

    Action id `cash_register_sales_add` · changes data · Site.pro Accounting: `cash-register/sales/add`

    **Inputs**

    - `typeId` (decimal, optional): Type ID. Possible values: 1 - sale, 2 - return, 3 - invoice.
    - `receiptId` (decimal): Receipt ID.
    - `receiptNumber` (text): Receipt number.
    - `receiptDate` (text): The sale date. Format: yyyy-MM-dd .
    - `customReceiptNumber` (text): Custom receipt number.
    - `paidWithMoney` (decimal): Sum paid with money multiplied by 100 . Example: 500,10 × 100 = 50010 . Either paidWithMoney , paidWithOther or paidWithCard has to be entered. Give the plain amount; the step sends it multiplied by 1
    - `paidWithOther` (decimal): Sum paid with other means multiplied by 100 . Example: 500,10 × 100 = 50010 . Either paidWithMoney , paidWithOther or paidWithCard has to be entered. Give the plain amount; the step sends it multiplie
    - `paidWithCard` (decimal): Sum paid with plastic card multiplied by 100 . Example: 500,10 × 100 = 50010 . Either paidWithMoney , paidWithOther or paidWithCard has to be entered. Give the plain amount; the step sends it multipli
    - `checkRoundSum` (decimal, optional): Round sum multiplied by 100 . Example: 0,010 × 100 = 1 . Give the plain amount; the step sends it multiplied by 100.
    - `total` (decimal): Total with VAT, multiplied by 100 . Example: 500,10 × 100 = 50010 . Give the plain amount; the step sends it multiplied by 100.
    - `vat` (decimal): VAT multiplied by 100 . Example: 10,1 × 100 = 1010 . Give the plain amount; the step sends it multiplied by 100.
    - `discount` (decimal): The discount sum with VAT, multiplied by 100 . Example: 10,1 × 100 = 1010 . Give the plain amount; the step sends it multiplied by 100.
    - `loyaltyCardNumber` (text, optional): Loyalty card number.
    - `cashRegisterNumber` (text, optional): Cash register number in Site.pro system.
    - `cashierFullName` (text, optional): Cashier code in Site.pro system (pers."DARBUOTOJAI".darb_kasos_kodas).
    - `purchaseDocument` (decimal, optional): Purchase document ID in Site.pro system
    - `items` (list): List of items (Array of Objects).

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

