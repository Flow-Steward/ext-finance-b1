    ### Create a cash transaction entry

    Create a cash transaction entry in Site.pro Accounting. Running the step again can create the record twice.

    Action id `cash_flow_transaction_entries_create` · changes data · Site.pro Accounting: `cash-flow/transaction-entries/create`

    **Inputs**

    - `transactionId` (whole number): reference CashFlowTransactions in the Site.pro system.
    - `correspondenceAccountId` (decimal): Correspondence account in the Site.pro system.
    - `amount` (decimal): transaction entry amount.
    - `note` (text, optional): Additional note.
    - `settleId` (decimal, optional): settling general ledger record ID in the Site.pro system.
    - `costCenterId` (decimal, optional): cost center ID in the Site.pro system.
    - `includeInIncomeTax312` (yes/no, optional): does record include in income tax 312. Use it only if transaction debit or credit indicator equal 'K'.
    - `incomeTaxType` (text, optional): income tax type A or B. Use it only if transaction debit or credit indicator equal 'K'.
    - `incomeTax312CodeId` (decimal, optional): income gpm312 code ID in the Site.pro system. Use it only if transaction debit or credit indicator equal 'K'.
    - `incomeTaxRate` (decimal, optional): income gpm312 rate in the Site.pro system. Use it only if transaction debit or credit indicator equal 'K'.
    - `deductTaxes` (yes/no, optional): does taxes deduct sign. Use it only if transaction debit or credit indicator equal 'K'.
    - `deductFromGpmAccumulationAccount` (yes/no, optional): does taxes deduct from accumulation account sign. Use it only if transaction debit or credit indicator equal 'K'.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

