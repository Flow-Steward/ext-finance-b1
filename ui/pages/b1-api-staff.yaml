    ### Create an employee

    Create an employee in Site.pro Accounting. Running the step again can create the record twice.

    Action id `personnel_employees_create` · changes data · Site.pro Accounting: `personnel/employees/create`

    **Inputs**

    - `name` (text)
    - `lastName` (text)
    - `genderId` (text): Possible values: V - male, M - female.
    - `nationalityId` (decimal, optional): Nationality ID in the Site.pro system.
    - `personalCode` (text, optional)
    - `clientId` (decimal, optional): Client ID in the Site.pro system.
    - `notes` (text, optional)
    - `groupId` (decimal): Group ID in the Site.pro system.
    - `address` (text, optional)
    - `cityId` (decimal, optional): City ID in the Site.pro system.
    - `passportSeries` (text, optional): Passport series. Maximum length is 10 characters.
    - `passportNumber` (text, optional)
    - `passportIssueDate` (text, optional): Format: yyyy-MM-dd
    - `passportIssueInstitutionId` (decimal, optional): Passport issue institution ID in the Site.pro system.
    - `phoneNumber` (text, optional)
    - `email` (text, optional): Email.
    - `socialInsuranceCardSeries` (text, optional): Social insurance card series. Maximum length is 10 characters.
    - `socialInsuranceCardNumber` (text, optional)
    - `driverCardSeries` (text, optional): Driver's card series. Maximum length is 10 characters.
    - `driverCardNumber` (text, optional)
    - `driverCardDate` (text, optional): Format: yyyy-MM-dd
    - `driverCardIssueInstitutionId` (decimal, optional): Driver's card issue institution ID in the Site.pro system.
    - `positionId` (decimal): Position ID in the Site.pro system.
    - `automobileId` (decimal, optional): Automobile ID in the Site.pro system.
    - `fuelCardId` (decimal, optional): Fuel card ID in the Site.pro system.
    - `bankAccount` (text, optional)
    - `spouse` (text, optional)
    - `spouseBirthDate` (text, optional): Format: yyyy-MM-dd
    - `maritalStatusId` (decimal, optional): Marital status ID. Possible values: 1 - Not married, 2 - Marrier, 3 - Divorced, 4 - Widow.
    - `socialInsuranceCardId` (text, optional): Social insurance card ID in the Site.pro system.
    - `worksUntil` (text, optional): Format: yyyy-MM-dd
    - `cashRegisterCode` (text, optional)
    - `medicalBookNumber` (text, optional): Medical book number.
    - `medicalBookExpireDate` (text, optional): Medical book expiration date.
    - `message` (text, optional): Message to employee.
    - `administratorId` (decimal, optional): Administrator ID in the Site.pro system.
    - `emailReceiverId` (decimal, optional): Email receiver ID in the Site.pro system.
    - `personalManagerId` (decimal, optional): Personal manager ID in the Site.pro system.
    - `directorId` (decimal, optional): Director ID in the Site.pro system.
    - `departmentId` (decimal, optional): Department ID in the Site.pro system.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Create an employee agreement

