    - `positionId` (decimal): Position ID in the Site.pro system.
    - `number` (text): Agreement number.
    - `agreementDate` (text): Format: yyyy-MM-dd
    - `workFrom` (text): Format: yyyy-MM-dd
    - `workUntil` (text, optional): Format: yyyy-MM-dd
    - `taxExemptIncome` (decimal, optional)
    - `departmentId` (decimal, optional): Department ID in the Site.pro system.
    - `expenseCorrespondenceAccountId` (decimal, optional): Expense correspondence account ID in the Site.pro system.
    - `salaryCorrespondenceAccountId` (decimal, optional): Salary correspondence account ID in the Site.pro system.
    - `guaranteeFundCorrespondenceAccountId` (decimal, optional): Guarantee fund correspondence account ID in the Site.pro system.
    - `socialInsuranceCorrespondenceAccountId` (decimal, optional): Social insurance correspondence account ID in the Site.pro system.
    - `guaranteeFundExpensesCorrespondenceAccountId` (decimal, optional): GF expenses correspondence account ID in the Site.pro system.
    - `socialInsuranceExpensesCorrespondenceAccountId` (decimal, optional): Social insurance expenses correspondence account ID in the Site.pro system.
    - `bankCorrespondenceAccountId` (decimal, optional): Bank correspondence account ID in the Site.pro system.
    - `cashFlowCorrespondenceAccountId` (decimal, optional): Cash flow correspondence account ID in the Site.pro system.
    - `salary` (decimal, optional): Numeric value, max 13 decimal places. Example: 1200.5000000000000
    - `hourRate` (decimal, optional): Numeric value, max 13 decimal places. Example: 10.2500000000000
    - `childrenCount` (decimal, optional)
    - `workHours` (decimal, optional): Numeric value, max 13 decimal places.
    - `saturdayWorkHours` (decimal, optional): Numeric value, max 13 decimal places.
    - `sundayWorkHours` (decimal, optional): Numeric value, max 13 decimal places.
    - `leaveDays` (decimal, optional)
    - `leaveAdditionalDays` (decimal, optional)
    - `timeCardNumber` (text): Time card number. Maximum length is 10 characters. Must be unique.
    - `isHourlyPaid` (yes/no, optional)
    - `hoursPerWeek` (decimal, optional): Numeric value, max 13 decimal places.
    - `isWorkHoursShortBeforeHolidays` (yes/no, optional)
    - `incomeTaxRateCorrespondenceAccountId` (decimal, optional): Income tax rate correspondence account ID in the Site.pro system.
    - `clause2` (text, optional)
    - `clause3` (text, optional)
    - `clause4` (text, optional)
    - `clause5` (text, optional)
    - `clause6` (text, optional)
    - `clause7` (text, optional)
    - `clause2En` (text, optional)
    - `clause3En` (text, optional)
    - `clause4En` (text, optional)
    - `clause5En` (text, optional)
    - `clause6En` (text, optional)
    - `clause7En` (text, optional)
    - `clause2Ru` (text, optional)
    - `clause3Ru` (text, optional)
    - `clause4Ru` (text, optional)
    - `clause5Ru` (text, optional)
    - `clause6Ru` (text, optional)
    - `clause7Ru` (text, optional)
    - `workPlace` (text, optional)
    - `workPlaceEn` (text, optional)
    - `workPlaceRu` (text, optional)
    - `individualIncomeTaxRate` (decimal, optional): Numeric value, max 13 decimal places, total length up to 18.
    - `salaryCodeId` (decimal, optional)

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

