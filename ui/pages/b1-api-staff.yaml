    ### Update a cv

    Update a cv in Site.pro Accounting.

    Action id `personnel_cvs_update` · changes data · Site.pro Accounting: `personnel/cvs/update`

    **Inputs**

    - `id` (decimal): ID in the Site.pro system.
    - `cvDate` (text): CV date. Format: yyyy-MM-dd ~(crm."CVDB".cv_data [date])
    - `communicationDate` (text, optional): Communication date. Format: yyyy-MM-dd ~(crm."CVDB".cv_bendravimo_data [date])
    - `positionId` (decimal, optional): Position ID in the Site.pro system ~(crm."CVDB".cv_par_id [integer])
    - `nameFirst` (text): name ~(crm."CVDB".cv_vardas [character varying(100)])
    - `lastNameLast` (text): name ~(crm."CVDB".cv_pavarde [character varying(100)])
    - `referName` (text, optional): Salutation / reference name ~(crm."CVDB".cv_kreipinys [character varying(100)])
    - `cityId` (decimal, optional): City ID in the Site.pro system ~(crm."CVDB".cv_miestas_id [integer])
    - `phoneNumber` (text, optional): Phone number ~(crm."CVDB".cv_telefonas [character varying(100)])
    - `email` (text, optional): Email address ~(crm."CVDB".cv_el_pastas [character varying])
    - `birthDate` (text, optional): Date of birth. Format: yyyy-MM-dd ~(crm."CVDB".cv_gimimo_data [date])
    - `levelId` (decimal, optional): CV level ID in the Site.pro system ~(crm."CVDB".cv_lygis_id [integer])
    - `isFreelancer` (yes/no, optional): Whether the candidate is a freelancer ~(crm."CVDB".cv_freelancer [boolean])
    - `cvAttribute1` (yes/no, optional): CV attribute #1 ~(crm."CVDB".cv_poz1 [boolean])
    - `cvAttribute2` (yes/no, optional): CV attribute #2 ~(crm."CVDB".cv_poz2 [boolean])
    - `cvAttribute3` (yes/no, optional): CV attribute #3 ~(crm."CVDB".cv_poz3 [boolean])
    - `cvAttribute4` (yes/no, optional): CV attribute #4 ~(crm."CVDB".cv_poz4 [boolean])
    - `cvAttribute5` (yes/no, optional): CV attribute #5 ~(crm."CVDB".cv_poz5 [boolean])
    - `experience` (text, optional): Work experience ~(crm."CVDB".cv_patirtis [text])
    - `notes` (text, optional): Notes ~(crm."CVDB".cv_pastabos [text])
    - `salaryFrom` (decimal, optional): Expected salary from ~(crm."CVDB".cv_alga_nuo [numeric])
    - `isUnsuitable` (yes/no, optional): Whether the candidate is marked as unsuitable ~(crm."CVDB".cv_netinka [boolean])
    - `isParticipatingInSelection` (yes/no, optional): Whether the candidate is participating in selection ~(crm."CVDB".cv_participating_in_selection [boolean])

