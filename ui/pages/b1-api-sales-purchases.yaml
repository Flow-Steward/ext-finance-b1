    \ at most 50 per run. Deletion cannot be undone.\n\nAction id `warehouse_stock_taking_items_delete` · changes data · Site.pro Accounting: `warehouse/stock-taking-items/delete`\n\n**Inputs**\n\n- `ids` (list): IDs to delete. Whole numbers, no repeats, at most 50.\n\n**Results**\n\n- `sent_ids` (list): The IDs sent for deletion (each an ID or a record of IDs).\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Delete warehouse sales\n\nDelete warehouse sales in Site.pro Accounting: only the records whose IDs are given, at most 50 per run. Deletion cannot be undone.\n\nAction id `warehouse_sales_delete` · changes data · Site.pro Accounting: `warehouse/sales/delete`\n\n**Inputs**\n\n- `ids` (list): IDs to delete. Whole numbers, no repeats, at most 50.\n\n**Results**\n\n- `sent_ids` (list): The IDs sent for deletion (each an ID or a record of IDs).\n- `data` (record): What\
    \ Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n"
- component_id: steps_account
  type: markdown
  title: File storage
  body: |
    ### Upload a file to a sale or purchase (file storage)

    Attach file to a sale or purchase. Warning: before uploading files make sure file storage is enabled in company/settings. There are limits for count files for one record and file size.

    Action id `account_file_storage_upload` · changes data · Site.pro Accounting: `account/file-storage/upload`

    **Inputs**

    - `recordId` (whole number): Record (sale or purchase) ID in the Site.pro system. Maximum 10 attachments per record.
    - `resourceName` (one of sale, purchase): What the record is.
    - `fileName` (text): File name (include the extension, e.g. file.pdf ).
    - `file` (file): A workflow file, up to 8 MB.
    - `content_type` (text, optional): The file's MIME type, for example application/pdf. Default application/octet-stream.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.
