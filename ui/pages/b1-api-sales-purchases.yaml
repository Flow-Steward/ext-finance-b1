  type: markdown
  title: Sales and purchases (warehouse)
  body: "### Create a long term asset group\n\nCreates a long-term asset group. Running the step again can create the record twice.\n\nAction id `warehouse_long_term_asset_groups_create` · changes data · Site.pro Accounting: `warehouse/long-term-asset-groups/create`\n\n**Inputs**\n\n- `name` (text): Name.\n- `duration` (decimal): Duration.\n- `correspondenceAccountId` (decimal, optional): Correspondence account ID in the Site.pro system.\n- `debitCorrespondenceAccountId` (decimal, optional): Debit correspondence account ID in the Site.pro system.\n- `creditCorrespondenceAccountId` (decimal, optional): Credit correspondence account ID in the Site.pro system.\n- `format` (text, optional): Format.\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Create a purchase\n\nCreates a purchase document. Running the step again\
    \ can create the record twice.\n\nAction id `warehouse_purchases_create` · changes data · Site.pro Accounting: `warehouse/purchases/create`\n\n**Inputs**\n\n- `warehouseId` (decimal): Warehouse ID in the Site.pro system.\n- `operationTypeId` (decimal): Operation type ID in the Site.pro system.\n- `supplierId` (decimal): Supplier type ID in the Site.pro system.\n- `purchaseDate` (text): Purchase date. Format: yyyy-MM-dd\n- `series` (text, optional): Purchase series.\n- `number` (text): Purchase number.\n- `advanceEmployeeId` (decimal, optional): Advance employee ID in the Site.pro system.\n- `currencyId` (decimal): Currency ID in the Site.pro system.\n- `payUntil` (text, optional): Pay until. Format: yyyy-MM-dd\n- `vatRateId` (decimal, optional): VAT rate ID in the Site.pro system.\n- `vatRateDate` (text, optional): VAT rate date. Format: yyyy-MM-dd\n- `vat` (decimal, optional): VAT multiplied by 100 . Example: 33,11 × 100 = 3311 . Give the plain amount; the step sends it multiplied by\
    \ 100.\n- `employeeId` (decimal): Employee ID in the Site.pro system.\n- `lockedFrom` (text, optional): Purchase locked from. Format: yyyy-MM-dd\n- `documentStateId` (decimal, optional): Document state ID in the Site.pro system.\n- `notes` (text, optional): Addition purchase notes.\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Create a purchase item\n\nCreates a purchase item line. Running the step again can create the record twice.\n\nAction id `warehouse_purchase_items_create` · changes data · Site.pro Accounting: `warehouse/purchase-items/create`\n\n**Inputs**\n\n- `purchaseId` (decimal): Purchase ID in the Site.pro system.\n- `position` (decimal): Item position (sequence number starting from 1).\n- `warehouseId` (decimal): Warehouse ID in the Site.pro system.\n- `itemId` (decimal): Item ID in the Site.pro\
    \ system.\n- `quantity` (decimal): Quantity multiplied by 1000 . Example: 3 × 1000 = 3000 . Give the plain amount; the step sends it multiplied by 1000.\n- `vatClassificationId` (decimal, optional): VAT classification ID in the Site.pro system. Example: 1 .\n- `vatRate` (decimal): VAT rate (%) multiplied by 100 . Example: 21,00 × 100 = 2100 . Give the plain amount; the step sends it multiplied by 100.\n- `priceWithoutVat` (decimal): Price without VAT multiplied by 10000 . Example: 3,7651 × 10000 = 37651 . Give the plain amount; the step sends it multiplied by 10000.\n- `priceWithVat` (decimal): Price with VAT multiplied by 10000 . Example: 4,4190 × 10000 = 44190 . Give the plain amount; the step sends it multiplied by 10000.\n- `priceWithoutVatWithDiscount` (decimal): Price with discount and without VAT multiplied by 10000 . Example: 3,7651 × 10000 = 37651 . Give the plain amount; the step sends it multiplied by 10000.\n- `discountRate` (decimal): Discount rate (%) multiplied by 1000\
    \ . Example: 3,00 × 1000 = 3000 . Give the plain amount; the step sends it multiplied by 1000.\n- `discount` (decimal): Discount with VAT multiplied by 1000000 . Example: 0,34 × 1000000 = 340000 . Give the plain amount; the step sends it multiplied by 1000000.\n- `discountSum` (decimal): Discount sum with VAT multiplied by 10000 . Example: 0,34 × 10000 = 3400 . Give the plain amount; the step sends it multiplied by 10000.\n- `returnPriceWithoutVat` (decimal, optional): Return price without VAT multiplied by 10000 . Example: 0,34 × 10000 = 3400 . Give the plain amount; the step sends it multiplied by 10000.\n- `returnVatRate` (decimal, optional): Return VAT rate (%) multiplied by 100 . Example: 21,00 × 100 = 2100 . Give the plain amount; the step sends it multiplied by 100.\n- `automobileId` (decimal, optional): Automobile ID in the Site.pro system.\n- `employeeId` (decimal, optional): Employee ID in the Site.pro system.\n- `fuelCardId` (decimal, optional): Fuel card ID in the Site.pro\
    \ system.\n- `correspondenceAccountId` (decimal, optional): Correspondence Account ID in the Site.pro system.\n- `notes` (text, optional): Addition item notes.\n- `accountantComment` (text, optional): Internal comment. Only visible in B1.\n- `costCenterId` (whole number, optional): Cost center ID in the Site.pro system.\n- `vatRegister` (decimal, optional): VAT register. Possible values are: 1 (EU items) and 2 (non-EU items)\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Create a purchase overhead costs from general journal\n\nLinks a general journal item as a purchase overhead cost. Running the step again can create the record twice.\n\nAction id `warehouse_purchase_overhead_costs_from_general_journals_create` · changes data · Site.pro Accounting: `warehouse/purchase-overhead-costs-from-general-journals/create`\n\
    \n**Inputs**\n\n- `purchaseId` (decimal): Purchase ID.\n- `generalLedgerItemId` (decimal): General journal item ID.\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Create a purchase overhead costs from purchase\n\nLinks a purchase item as a purchase overhead cost. Running the step again can create the record twice.\n\nAction id `warehouse_purchase_overhead_costs_from_purchases_create` · changes data · Site.pro Accounting: `warehouse/purchase-overhead-costs-from-purchases/create`\n\n**Inputs**\n\n- `purchaseId` (decimal): Purchase ID.\n- `purchaseItemId` (decimal): Source purchase item ID.\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n\
    ### Create a sale\n\nCreates a sale document header. Running the step again can create the record twice.\n\nAction id `warehouse_sales_create` · changes data · Site.pro Accounting: `warehouse/sales/create`\n\n**Inputs**\n\n- `saleDate` (text): Sale date. Format: yyyy-MM-dd\n- `payUntil` (text, optional): Pay until. Format: yyyy-MM-dd\n- `autoGenerateNumberAndSeries` (yes/no, optional): When this is true - B1 will generate number and series internally for the specified sale, otherwise, if value equals to false , specified series & number will be used.\n- `series` (text, optional): Sale series. If autoGenerateNumberAndSeries equals to false - this parameter is required.\n- `number` (text, optional): Sale number. If autoGenerateNumberAndSeries equals to false - this parameter is required.\n- `warehouseId` (decimal): Warehouse ID in Site.pro system.\n- `clientId` (decimal): Client ID in Site.pro system.\n- `operationTypeId` (decimal): Operation type ID in Site.pro system. See here\n- `internalMoveToWarehouseId`\
    \ (decimal, optional): Internal move to warehouse ID in Site.pro system. Required when operation type is \"Internal move\".\n- `isConfirmedInternally` (yes/no, optional): If true - moving from one warehouse to another. If false - move confirmed\n- `exchangeRateId` (decimal, optional): Exchange rate ID in the Site.pro system.\n- `employeeId` (decimal): Employee ID in the Site.pro system.\n- `statusId` (decimal, optional): Document status in the Site.pro system.\n- `givenToAccountantOn` (text, optional): Given to accountant on date. Format: yyyy-MM-dd\n- `vatRateId` (decimal, optional): VAT rate ID in Site.pro system.\n- `notes` (text, optional): Notes.\n- `isLockedFrom` (text, optional): Is locked from date. Format: yyyy-MM-dd\n- `transactionId` (text, optional): Transaction ID in external system.\n- `checkNumber` (text, optional): Check number.\n- `payerId` (decimal, optional): Payer ID in Site.pro system.\n- `orderNumberClient` (text, optional): Client's Order number in external system.\n\
    - `orderBillNumber` (text, optional): Order bill number in external system.\n- `orderDate` (text, optional): Order date in external system. Format: yyyy-MM-dd\n- `orderDateReceipt` (text, optional): Order receipt date in external system. Format: yyyy-MM-dd\n- `orderDepartureDate` (text, optional): Order departure date. Format: yyyy-MM-dd\n- `orderDeliveryEstimateDate` (text, optional): Order delivery estimate date. Format: yyyy-MM-dd\n- `orderDeliveryEstimateTime` (text, optional): Order delivery estimate time. Format: hh:mm\n- `orderDeliveryRevisedDate` (text, optional): Order delivery revised date. Format: yyyy-MM-dd\n- `orderDeliveryRevisedTime` (text, optional): Order delivery revised time. Format: hh:mm\n- `orderNumberEShop` (text, optional): Order number in external system (additional).\n- `unloadAddressId` (decimal, optional): Client's address ID in Site.pro system. See here .\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting\
    \ returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Create a sale from a cash register receipt\n\nCreates a sale document in B1 from cash-register receipt data. Running the step again can create the record twice.\n\nAction id `warehouse_cash_register_sales_receipt_create` · changes data · Site.pro Accounting: `warehouse/cash-register-sales/receipt-create`\n\n**Inputs**\n\n- `typeId` (decimal, optional): Type ID. Possible values: 1 - sale (receipt), 2 - return, 3 - invoice. When 3 is used, invoice and client fields below are required.\n- `receiptId` (decimal): Receipt ID.\n- `receiptNumber` (text): Receipt number.\n- `receiptDate` (text): The sale date. Format: yyyy-MM-dd .\n- `customReceiptNumber` (text): Custom receipt number. For invoices, use the full invoice number (series + number).\n- `clientName` (text, optional): Client company name. Required when typeId is 3 (invoice).\n- `clientCode` (text, optional):\
    \ Client company code.\n- `clientVatCode` (text, optional): Client VAT code.\n- `clientAddress` (text, optional): Client address.\n- `invoiceSeries` (text, optional): Invoice document series. Required when typeId is 3 (invoice).\n- `invoiceNumber` (text, optional): Invoice document number. Required when typeId is 3 (invoice).\n- `paidWithMoney` (decimal): Sum paid with money, precision 2. Example: 500.10 . Either paidWithMoney , paidWithOther or paidWithCard has to be entered.\n- `paidWithOther` (decimal): Sum paid with other means, precision 2. Example: 500.10 . Either paidWithMoney , paidWithOther or paidWithCard has to be entered.\n- `paidWithCard` (decimal): Sum paid with plastic card, precision 2. Example: 500.10 . Either paidWithMoney , paidWithOther or paidWithCard has to be entered.\n- `checkRoundSum` (decimal, optional): Round sum, precision 2. Example: 0.01 .\n- `total` (decimal): Total with VAT, precision 2. Example: 500.10 .\n- `vat` (decimal): VAT, precision 2. Example:\
    \ 10.10 .\n- `discount` (decimal): Discount sum with VAT, precision 2. Example: 10.10 .\n- `loyaltyCardNumber` (text, optional): Loyalty card number.\n- `cashRegisterNumber` (text, optional): Cash register number in Site.pro system.\n- `cashierFullName` (text, optional): Cashier code in Site.pro system (pers.\"DARBUOTOJAI\".darb_kasos_kodas).\n- `purchaseDocument` (decimal, optional): Purchase document ID in Site.pro system\n- `items` (list): List of items (Array of Objects).\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Create a sale item\n\nCreates a sale item line. Running the step again can create the record twice.\n\nAction id `warehouse_sale_items_create` · changes data · Site.pro Accounting: `warehouse/sale-items/create`\n\n**Inputs**\n\n- `calculationMode` (whole number): What to use when calculating\
    \ sale item sums, prices, discount, etc... Possible values: 1 - quantity / VAT rate, 2 - price without VAT, 3 - discount rate, 4 - unit discount, 5 - discount, 6 - price wit\n- `saleId` (whole number): Sale ID in the Site.pro system.\n- `position` (whole number, optional): Item position.\n- `purchaseItemId` (whole number, optional): Purchase item ID in the Site.pro system related to this Sale item. Must be entered if the item's attribute is marked as \"isQuantitative\". otherwise must be NULL.\n- `itemId` (whole number): Item ID in the Site.pro system (from warehouse stock list).\n- `saleCorrespondenceAccountId` (whole number, optional): Sale correspondence account ID in the Site.pro system.\n- `expenseCorrespondenceAccountId` (whole number, optional): Expense correspondence account ID in the Site.pro system.\n- `quantity` (decimal): Quantity of items to sell, precision 3. Example: 3\n- `priceWithoutVat` (decimal, optional): Item price without VAT (1 unit), precision 4. Example: 145.12\n\
    - `discountRate` (decimal, optional): Discount percentage, precision 4. Example: 2\n- `unitDiscount` (decimal, optional): Discount for 1 product unit, precision 6. Example: -2.9024\n- `discount` (decimal, optional): Discount in total, precision 2. Example: -5.8\n- `vatRate` (decimal, optional): VAT rate, precision 2. Example: 21\n- `priceWithoutVatWithDiscount` (decimal, optional): Item (1 unit) price without VAT with discount, precision 4. Example: 142.2176\n- `priceWithVat` (decimal, optional): Item (1 unit) price with VAT, precision 4. Example: 172.0833\n- `exciseRate` (decimal, optional): Excise rate per unit, precision 6. Example: 2.250000\n- `exciseSum` (decimal, optional): Excise amount, precision 6. Example: 6.750000\n- `addition` (text, optional)\n- `warehouseId` (whole number): Warehouse ID in the Site.pro system.\n- `comment` (text, optional)\n- `vatClassificationId` (whole number): VAT classification ID in the Site.pro system.\n- `intrastatDeliveryTermId` (whole number, optional):\
    \ Intrastat delivery term ID in the Site.pro system.\n- `intrastatTransactionId` (whole number, optional): Intrastat transaction ID in the Site.pro system.\n- `intrastatTransportId` (whole number, optional): Intrastat transport ID in the Site.pro system.\n- `netWeight` (decimal, optional): NET weight. Precision 2. Example: 0.5\n- `countyId` (whole number, optional): County ID in the Site.pro system.\n- `costCenterId` (whole number, optional): Cost center ID in the Site.pro system.\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Create a sale item (simple, FIFO write-off)\n\nCreates a sale item line using simplified payload. For quantitatively accounted items, write-off is performed using FIFO. Running the step again can create the record twice.\n\nAction id `warehouse_sale_items_create_simple` · changes data\
    \ · Site.pro Accounting: `warehouse/sale-items/create-simple`\n\n**Inputs**\n\n- `saleId` (whole number): Sale document ID in the Site.pro system.\n- `itemId` (whole number): Item ID in the Site.pro system (from warehouse stock list).\n- `quantity` (decimal): sold quantity, precision 3. Example: 3\n- `priceWithoutVat` (decimal): Price without VAT, if the price with VAT is entered, then the price with VAT will be used as the basis for the calculation, precision 4. Example: 145.12\n- `vatRate` (decimal, optional): VAT rate (exmple 21, 25.5, 9, 0 , null, etc.) if the VAT rate is not transferred, it will be calculated as without VAT\n- `postscriptText` (text, optional): postscript, for sale report\n- `warehouseId` (whole number, optional): Warehouse ID in the Site.pro system. If not specified, the warehouse will be taken from the main sales document\n- `rowNo` (whole number, optional): number of row, this affects the print on which line to display the item\n- `priceWithVat` (decimal, optional):\
    \ price with VAT, if the price with VAT is entered, then the price with VAT will be used as the basis for the calculation, precision 4. Example: 172.0833\n- `discountRate` (decimal, optional): Discount percentage, precision 4. Example: 2\n- `vatClassificationId` (whole number, optional): VAT classification ID in the Site.pro system.\n- `costCorrAccountId` (whole number, optional): cost cor. account identifier from B1, if it is not specified, it will be collected from item card\n- `saleCorrAccountId` (whole number, optional): sale cor. account identifier from B1, if it is not specified, it will be collected from item card\n- `costCenterId` (whole number, optional): Cost center ID in the Site.pro system.\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Create a stock taking\n\nCreates a stock-taking document header.\
    \ Running the step again can create the record twice.\n\nAction id `warehouse_stock_taking_create` · changes data · Site.pro Accounting: `warehouse/stock-taking/create`\n\n**Inputs**\n\n- `stockTakingDate` (text): Stock-taking date. Format: yyyy-MM-dd\n- `number` (text): Stock-taking document number.\n- `isSortByItemGroups` (yes/no, optional): If true , group generated lines by item groups.\n- `idsItemGroupsList` (text, optional): Comma-separated item group IDs, e.g. \"1,4\" .\n- `idsSuppliersList` (text, optional): Comma-separated supplier IDs, e.g. \"1,4\" .\n- `idsAttributesList` (text, optional): Comma-separated item attribute IDs, e.g. \"1,4\" .\n- `idsWarehousesList` (text, optional): Comma-separated warehouse IDs, e.g. \"1,4\" .\n- `idsItemCardsList` (text, optional): Comma-separated item card IDs, e.g. \"1,4\" .\n- `idsCorrespondenceAccountList` (text, optional): Comma-separated correspondence account IDs, e.g. \"1,4\" .\n- `note` (text, optional): Additional stock-taking notes.\n\
    \n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Create a stock taking item\n\nCreates one stock-taking item line in a stock-taking document. Running the step again can create the record twice.\n\nAction id `warehouse_stock_taking_items_create` · changes data · Site.pro Accounting: `warehouse/stock-taking-items/create`\n\n**Inputs**\n\n- `accountingAmount` (decimal, optional): Accounting amount.\n- `accountingQuantity` (decimal, optional): Accounting item quantity. Precision 3. Example: 3 .\n- `actualAmount` (decimal, optional): Actual amount.\n- `actualQuantity` (decimal, optional): Actual item quantity. Precision 3. Example: 3 .\n- `cost` (decimal, optional): Item primary cost.\n- `deficitExcess` (decimal, optional): Deficiency or excess quantity. Example: -1 for deficiency.\n- `entered` (yes/no, optional)\n\
    - `itemBarCode` (text, optional): Item barcode.\n- `itemCode` (text, optional): Item code.\n- `itemId` (decimal): Item ID in the Site.pro system.\n- `itemName` (text, optional): Item name.\n- `stockTakingId` (decimal): ID of stock-taking document in the Site.pro system.\n- `unit` (text, optional): Measurement unit.\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Generate a sale report file\n\nGenerates a sale report file and returns download metadata. The generated file is available for approximately 1 hour.\n\nAction id `warehouse_sale_reports_generate` · changes data · Site.pro Accounting: `warehouse/sale-reports/generate`\n\n**Inputs**\n\n- `formatId` (whole number): File format. 1 - PDF, 2 - DOC, 3 - EXCEL.\n- `groupModeId` (whole number): Group mode.\n- `languageId` (whole number): Language. 1 - LT, 2 -\
    \ EN, 3 - RU, 4 - LV, 5 - EE\n- `saleIds` (list): List of sale IDs.\n- `templateId` (whole number): File template ID. Possible values: 1 for Invoice with VAT 2 for Invoice without VAT 3 for Invoice with VAT and English language (only for lt) 4 for Invoice with VAT and Russian language (only for lt) \n- `exchangeRateId` (whole number, optional): Exchange rate ID in the Site.pro system. Some reports require it.\n\n**Results**\n\n- `id` (whole number): The record's ID.\n- `data` (record): What Site.pro Accounting returned.\n- `message` (text): Its message.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Get a note file\n\nGet a warehouse note file.\n\nAction id `warehouse_note_files_get` · reads only · Site.pro Accounting: `warehouse/note-files/get`\n\n**Inputs**\n\n- `id` (whole number): Warehouse note file ID in the Site.pro system.\n\n**Results**\n\n- `file` (file): The file, as a workflow file.\n- `file_name` (text): Its file name.\n- `mime_type` (text):\
    \ Its type.\n- `size_bytes` (whole number): Its size.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Get a purchase file\n\nDownloads a purchase file binary by file ID.\n\nAction id `warehouse_purchase_files_get` · reads only · Site.pro Accounting: `warehouse/purchase-files/get`\n\n**Inputs**\n\n- `id` (whole number): Purchase File ID in the Site.pro system.\n\n**Results**\n\n- `file` (file): The file, as a workflow file.\n- `file_name` (text): Its file name.\n- `mime_type` (text): Its type.\n- `size_bytes` (whole number): Its size.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Get a sale file\n\nDownloads a sale file binary by file ID.\n\nAction id `warehouse_sale_files_get` · reads only · Site.pro Accounting: `warehouse/sale-files/get`\n\n**Inputs**\n\n- `id` (whole number): Sale File ID in the Site.pro system.\n\n**Results**\n\n- `file` (file): The file, as a workflow file.\n- `file_name` (text): Its file name.\n-\
    \ `mime_type` (text): Its type.\n- `size_bytes` (whole number): Its size.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Get a sale invoice file\n\nGenerates and returns a sale invoice report file.\n\nAction id `warehouse_invoices_get_sale` · reads only · Site.pro Accounting: `warehouse/invoices/get-sale`\n\n**Inputs**\n\n- `series` (text): The Sale series.\n- `number` (text): The Sale number.\n- `id` (whole number, optional): Sale ID. Optional when series and number are provided.\n- `language` (text, optional): Language code. Available values: lt , en , ru .\n- `templateId` (decimal, optional): The invoice template ID. Possible values: 1 for Invoice with VAT 2 for Invoice without VAT 3 for Invoice with VAT and English language (only for lt) 4 for Invoice with VAT and Russian language (only f\n\n**Results**\n\n- `file` (file): The file, as a workflow file.\n- `file_name` (text): Its file name.\n- `mime_type` (text): Its type.\n- `size_bytes` (whole number):\
    \ Its size.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Get a sale's UPD file\n\nGenerates and returns a UPD report file for a sale.\n\nAction id `warehouse_invoices_get_upd` · reads only · Site.pro Accounting: `warehouse/invoices/get-upd`\n\n**Inputs**\n\n- `series` (text): The Sale series.\n- `number` (text): The Sale number.\n- `id` (whole number, optional): Sale ID. Optional when series and number are provided.\n- `language` (text, optional): Language code. Available values: lt , en , ru .\n\n**Results**\n\n- `file` (file): The file, as a workflow file.\n- `file_name` (text): Its file name.\n- `mime_type` (text): Its type.\n- `size_bytes` (whole number): Its size.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Get a sale's delivery-acceptance act PDF\n\nGenerates and returns a PDF delivery-acceptance act for a sale.\n\nAction id `warehouse_delivery_acceptance_acts_get_sale` · reads only · Site.pro Accounting: `warehouse/delivery-acceptance-acts/get-sale`\n\
    \n**Inputs**\n\n- `id` (decimal): Sale ID in Site.pro system (see /warehouse/sales/list ).\n- `language` (text, optional): Document language code. Available values: lt , en , ru .\n\n**Results**\n\n- `file` (file): The file, as a workflow file.\n- `file_name` (text): Its file name.\n- `mime_type` (text): Its type.\n- `size_bytes` (whole number): Its size.\n- `warnings` (list): What the step could not do fully or what to check.\n\n### Get recognized data of a stored file\n\nReturns LLM+OCR-recognized data for a warehouse file. If the file was converted, the document data is returned. To use this method, you first need to upload the file using the add-purchase or add-sale method.\n\nAction id `warehouse_temp_files_get_recognized_data` · reads only · Site.pro Accounting: `warehouse/temp-files/get-recognized-data`\n\n**Inputs**\n\n- `id` (decimal): File ID returned by the add-purchase or add-sale endpoint.\n\n**Results**\n\n- `data` (record): What Site.pro Accounting returned.\n- `message`\
