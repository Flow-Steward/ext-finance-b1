    ### List client item prices

    Returns client-specific item prices. Always pass clientId (and optionally itemId ); unbounded lists over the full price matrix are rejected because they can time out on large companies.

    Action id `client_item_prices_list` · reads only · Site.pro Accounting: `client/item-prices/list`

    **Inputs**

    - `rows` (one of 10, 20, 30, 50, 100, 200, …, optional): How many records to return. Default 100.
    - `page` (whole number, optional): The page to read, from 1.
    - `sidx` (one of appliedPrice, attributeName, clientBaseId, clientCode, clientId, clientName, …, optional): The field to sort by.
    - `sord` (one of asc, desc, optional): asc or desc.
    - `filters` (list, optional): Rules, all of which must hold: field, op (eq, ne, lt, le, gt, ge, bw, bn, in, ni, ew, en, cn, nc, nu, nn) and data.
    - `clientId` (decimal): Client ID in the Site.pro system. Required to keep the query bounded.
    - `itemId` (decimal, optional): Item ID in the Site.pro system.

    **Results**

    - `items` (list): The records of this page.
    - `count` (whole number): How many records this page holds.
    - `page` (whole number): This page's number.
    - `pages` (whole number): How many pages there are.
    - `records` (whole number): How many records match.
    - `next_cursor` (text): Pass it as cursor to read on; null at the end.
    - `has_more` (yes/no): True when more records follow (cursor mode).
    - `warnings` (list): What the step could not do fully or what to check.

