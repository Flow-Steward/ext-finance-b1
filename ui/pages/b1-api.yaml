    ### Record a bank payment for a sale invoice

    Creates a bank payment record for an existing sale invoice. Use this endpoint when a sale invoice already exists and you need to record the payment separately. Typical workflow for Verskis, Pigu, and Varle: wait for automatic order import (see e-commerce/orders/list ), then call this method with the returned saleId . The payment configuration code is taken from the API account name (Account → API). Ensure a matching record exists in Settings → Data exchange → Payment configurations . Running the step again can create the record twice.

    Action id `bank_sale_invoice_payment` · changes data · Site.pro Accounting: `bank/sale-invoice/payment`

    **Inputs**

    - `saleId` (decimal): Sale ID in the Site.pro system.
    - `paymentId` (text): Unique bank payment number.
    - `paymentDate` (text): Bank record date.
    - `sum` (decimal): Amount multiplied by 100 . Example: 3 × 100 = 300 . Give the plain amount; the step sends it multiplied by 100.
    - `tax` (decimal): Tax amount multiplied by 100 . Example: 0.63 × 100 = 63 . Give the plain amount; the step sends it multiplied by 100.
    - `currency` (text): Currency code. Example: EUR .
    - `purpose` (text): Payment note.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.
