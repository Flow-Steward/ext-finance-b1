page_id: b1-api
title: B1 API
description: 'Every B1 (Site.pro Accounting) step: what it does, which call it makes, its inputs and results.'
components:
- component_id: api_overview
  type: markdown
  title: How the steps work
  body: |
    B1 (Site.pro Accounting) is reached through its API at site.pro. Each step makes one documented call, except the everyday steps, which make several.

    - **Amounts are plain decimals.** Where Site.pro Accounting takes an amount multiplied by 100, 1000, 10000 or 1000000, the step does it; a value with more decimals than that allows is refused before anything is sent.
    - **Writes are sent once.** Flow Steward remembers every change it made, so a retried step does not send it twice, and test runs never send. When the outcome is unclear, the step is not retried: check Site.pro Accounting first.
    - **Lists return pages** of up to 500 records; pass next_cursor or the next page.
    - **Reports** are generated in the background: a task ID first, the file about a minute later.
- component_id: steps_everyday
  type: markdown
  title: Everyday
  body: |
    ### Test the connection

    Checks the API key by listing ten currencies.

    Action id `test_connection` · reads only · Site.pro Accounting: `reference-book/currencies/list`

    **Inputs**

    - none

    **Results**

    - `connected` (yes/no): True when the key works.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Find a client

    Finds the one client whose code, VAT code and e-mail (those given) match exactly. Several matches stop the step with a conflict.

    Action id `find_client` · reads only · Site.pro Accounting: `clients/list`

    **Inputs**

    - `code` (text, optional): The client's company or personal code, exactly.
    - `vat_code` (text, optional): The client's VAT code, exactly.
    - `email` (text, optional): The client's e-mail, exactly.

    **Results**

    - `found` (yes/no): True when a client matches.
    - `client` (record): The client, as Site.pro Accounting lists it.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Find or create a client

    Finds the client by its code, VAT code and e-mail (those given, all exactly); creates it only when none matches. Several matches stop the step with a conflict and nothing is created.

    Action id `find_or_create_client` · changes data · Site.pro Accounting: `clients/list`, `clients/create`

    **Inputs**

    - `code` (text, optional): The client's company or personal code, exactly.
    - `vat_code` (text, optional): The client's VAT code, exactly.
    - `email` (text, optional): The client's e-mail, exactly.
    - `name` (text, optional): The name of a new client.
    - `short_name` (text, optional): The short name of a new client.
    - `location_id` (whole number, optional): The location (country) ID of a new client in Site.pro Accounting.
    - `is_juridical` (yes/no, optional): A new client is a company, not a person.
    - `phone_number` (text, optional): The phone of a new client.
    - `is_supplier` (yes/no, optional): A new client is also a supplier.

    **Results**

    - `client_id` (whole number): The client's ID.
    - `created` (yes/no): True when this step created it.
    - `client` (record): The client found, or null when created.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Find an item

    Finds the one item whose code and barcode (those given) match exactly, with its prices and stock. Several matches stop the step with a conflict.

    Action id `find_item` · reads only · Site.pro Accounting: `reference-book/items/list`

    **Inputs**

    - `code` (text, optional): The item's code, exactly.
    - `barcode` (text, optional): The item's barcode, exactly.

    **Results**

    - `found` (yes/no): True when an item matches.
    - `item` (record): The item, as Site.pro Accounting lists it.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Find or create an item

    Finds the item by its code and barcode (those given, exactly); creates it only when none matches. Several matches stop the step with a conflict.

    Action id `find_or_create_item` · changes data · Site.pro Accounting: `reference-book/items/list`, `reference-book/items/create`

    **Inputs**

    - `code` (text, optional): The item's code, exactly.
    - `barcode` (text, optional): The item's barcode, exactly.
    - `name` (text, optional): The name of a new item.
    - `attribute_id` (whole number, optional): The item attribute (product or service) ID of a new item.
    - `measurement_unit_id` (whole number, optional): The unit of measure ID of a new item.
    - `group_id` (whole number, optional): The item group ID of a new item.
    - `price_without_vat` (decimal, optional): The price of a new item.
    - `vat_rate` (decimal, optional): The VAT rate of a new item, in percent.
    - `price_with_vat` (decimal, optional): The price with VAT of a new item.

    **Results**

    - `item_id` (whole number): The item's ID.
    - `created` (yes/no): True when this step created it.
    - `item` (record): The item found, or null when created.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Create a sales invoice with lines

    Creates a sale document and its lines (quantitatively accounted items are written off FIFO). The transaction ID from your system is required: when Site.pro Accounting already has a sale with it, the step stops with a conflict and creates nothing. A step that fails half-way says which records it created, with their ids, and deletes nothing.

    Action id `create_sales_invoice` · changes data · Site.pro Accounting: `warehouse/sales/list`, `warehouse/sales/create`, `warehouse/sale-items/create-simple`

    **Inputs**

    - `transaction_id` (text): The sale's ID in your system (transactionId); it keeps reruns from creating the sale twice.
    - `sale_date` (date): The sale date. YYYY-MM-DD.
    - `pay_until` (date, optional): The payment due date. YYYY-MM-DD.
    - `warehouse_id` (whole number): The warehouse.
    - `client_id` (whole number): The client.
    - `operation_type_id` (whole number): The operation type.
    - `employee_id` (whole number): The employee issuing it.
    - `series` (text, optional): The series; leave series and number empty to have them generated.
    - `number` (text, optional): The number, with the series.
    - `vat_rate_id` (whole number, optional): The VAT rate of the document.
    - `notes` (text, optional): Notes.
    - `order_number_client` (text, optional): The client's order number in your system.
    - `lines` (list): The lines, 1 to 200: item_id, quantity, price_without_vat and optionally price_with_vat, vat_rate, discount_rate, vat_classification_id, warehouse_id, postscript_text.

    **Results**

    - `sale_id` (whole number): The sale's ID.
    - `line_ids` (list): The lines' IDs.
    - `transaction_id` (text): The transaction ID sent.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Find a sale by transaction ID or number

    Finds the one sale with this transaction ID, or series and number.

    Action id `find_sale` · reads only · Site.pro Accounting: `warehouse/sales/list`

    **Inputs**

    - `transaction_id` (text, optional): The sale's ID in your system.
    - `series` (text, optional): The series.
    - `number` (text, optional): The number.

    **Results**

    - `found` (yes/no): True when a sale matches.
    - `sale` (record): The sale, as Site.pro Accounting lists it.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Create a purchase invoice with lines

    Creates a purchase document and its lines, without discounts. When Site.pro Accounting already has this supplier's purchase with the same number (and series), the step stops with a conflict and creates nothing. A step that fails half-way says which records it created, with their ids, and deletes nothing.

    Action id `create_purchase_invoice` · changes data · Site.pro Accounting: `warehouse/purchases/list`, `warehouse/purchases/create`, `warehouse/purchase-items/create`

    **Inputs**

    - `supplier_id` (whole number): The supplier (a client).
    - `number` (text): The supplier's document number.
    - `series` (text, optional): The supplier's document series.
    - `purchase_date` (date): The purchase date. YYYY-MM-DD.
    - `pay_until` (date, optional): The payment due date. YYYY-MM-DD.
    - `warehouse_id` (whole number): The warehouse.
    - `operation_type_id` (whole number): The operation type.
    - `currency_id` (whole number): The currency.
    - `employee_id` (whole number): The employee.
    - `vat_rate_id` (whole number, optional): The VAT rate of the document.
    - `vat` (decimal, optional): The document's VAT amount, 2 decimals.
    - `notes` (text, optional): Notes.
    - `lines` (list): The lines, 1 to 200: item_id, quantity, price_without_vat, price_with_vat, vat_rate and optionally vat_classification_id, warehouse_id, notes.

    **Results**

    - `purchase_id` (whole number): The purchase's ID.
    - `line_ids` (list): The lines' IDs.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Record a payment for a sale (checked for repeats)

    Records a bank payment for an existing sale. When Site.pro Accounting already has a bank transaction with this payment number, the step stops with a conflict and records nothing.

    Action id `record_sale_payment` · changes data · Site.pro Accounting: `bank/transactions/list`, `bank/sale-invoice/payment`

    **Inputs**

    - `sale_id` (whole number): The sale paid.
    - `payment_id` (text): The bank payment's unique number.
    - `payment_date` (date): The bank record date. YYYY-MM-DD.
    - `amount` (decimal): The amount paid, 2 decimals.
    - `tax` (decimal): The tax amount, 2 decimals.
    - `currency` (text): The currency code, for example EUR.
    - `purpose` (text): The payment note.

    **Results**

    - `transaction_id` (text): The bank transaction's ID.
    - `payment_id` (text): The payment number sent.
    - `warnings` (list): What the step could not do fully or what to check.

    ### Get a report (generate and wait)

    Generates one of the reports and waits for its file, saving it as a workflow file; when it is not ready in time, returns its task ID for Get a generated report file. Site.pro Accounting offers its reports as a beta.

    Action id `get_report` · reads only · Site.pro Accounting: `reports/*`, `reports/get`

    **Inputs**

    - `report` (text): The step ID of the Generate … report step, for example reports_general_ledger_general_ledger_trial_balance.
    - `parameters` (record, optional): That report's inputs, as on its own step.

    **Results**

    - `ready` (yes/no): True when the report file was saved.
    - `task_id` (whole number): The report task's ID.
    - `file` (file): The report, as a workflow file.
    - `file_name` (text): Its file name.
    - `mime_type` (text): Its type.
    - `size_bytes` (whole number): Its size.
    - `warnings` (list): What the step could not do fully or what to check.
- component_id: steps_client
  type: markdown
  title: Clients
  body: |
    ### Create a client

    Create a client in Site.pro Accounting. Running the step again can create the record twice.

    Action id `clients_create` · changes data · Site.pro Accounting: `clients/create`

    **Inputs**

    - `name` (text): Client's name.
    - `shortName` (text, optional): Client's short name.
    - `isActive` (yes/no, optional): Whenever the client should be treated as active in the Site.pro system.
    - `isJuridical` (yes/no, optional): Whenever the client is juridical (legal) or physical (natural) entity.
    - `locationId` (decimal): Client's location. Possible values: 1 - Local, 2 - EU member, 3 - Non-EU member.
    - `code` (text, optional): Company's code or person's personal code. {..30} for UAE.
    - `vatCode` (text, optional): Client's VAT code. {..15} for UAE.
    - `businessLicenseCode` (text, optional): Client's business license code. {..30} for UAE.
    - `vatRateId` (decimal, optional): VAT rate ID in Site.pro system.
    - `phoneNumber` (text, optional): Client's phone number.
    - `faxNumber` (text, optional): Client's fax number.
    - `website` (text, optional): Client's website address.
    - `email` (text, optional): Client's email address.
    - `contactInformation` (text, optional): Client's contact information.
    - `notes` (text, optional): Additional notes about the client.
    - `creditSum` (decimal, optional): Credit sum.
    - `payWithin` (decimal, optional): Pay within the specified number of days.
    - `isSupplier` (yes/no, optional): Whenever the client is supplier.
    - `isPotentialClient` (yes/no, optional): Whenever the client is potential client.
    - `isMemberOfGroup` (yes/no, optional): Whenever the client is a member of owner's group.
    - `statusId` (decimal, optional): Status ID in Site.pro system.
    - `firstCall` (text, optional): When was the first call made. Format: yyyy-MM-dd .
    - `groupId` (decimal, optional): Group ID in the Site.pro system.
    - `latestCall` (text, optional): When was the latest call made. Format: yyyy-MM-dd .
    - `evaluationScore` (decimal, optional): Evaluation score.
    - `nextCall` (text, optional): When next call should be made. Format: yyyy-MM-dd .
    - `latestCommunicationEmployeeId` (decimal, optional): Employee ID in the Site.pro system who communicated with the client.
    - `birthday` (text, optional): Date of birth. Format: yyyy-MM-dd .
    - `residentCode` (text, optional): Taxpayer identification number in a foreign country.

    **Results**

    - `id` (whole number): The record's ID.
    - `data` (record): What Site.pro Accounting returned.
    - `message` (text): Its message.
    - `warnings` (list): What the step could not do fully or what to check.

