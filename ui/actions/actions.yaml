- action_id: bank_sale_invoice_payment
  title: Record a bank payment for a sale invoice
  description: 'Creates a bank payment record for an existing sale invoice. Use this endpoint when a sale
    invoice already exists and you need to record the payment separately. Typical workflow for Verskis,
    Pigu, and Varle: wait for automatic order import (see e-commerce/orders/list ), then call this method
    with the returned saleId . The payment configuration code is taken from the API account name (Account
    → API). Ensure a matching record exists in Settings → Data exchange → Payment configurations . Running
    the step again can create the record twice.'
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  command_type: invoke_extension_action
  mutates_platform: true
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: saleId
    type: string
    required: true
