  description: Generates a declaration .ffdata (XML) file synchronously and returns it as an attachment.
    Validation matches the UI form at declaration/generations . Unlike the UI, this endpoint does not
    queue a background task — the file bytes are returned in the HTTP response body. Generates the declaration
    from the company's accounting data for the period; Site.pro Accounting may record the generation,
    and the step cannot undo it.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  command_type: invoke_extension_action
  mutates_platform: true
  workflow_visible: true
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
  - name: templateId
    type: integer
    required: true
  - name: dateFrom
    type: string
    required: false
  - name: dateTill
    type: string
    required: false
  - name: year
    type: integer
    required: false
  - name: month
    type: integer
    required: false
  - name: addCurrentMonth
    type: boolean
    required: false
  - name: addPreviousMonth
    type: boolean
    required: false
  - name: source
    type: boolean
    required: false
  result_fields:
  - file
  - file_name
  - mime_type
  - size_bytes
  - warnings
  - external_effect_status
  - definitely_no_external_effect
