connection_types:
  - connection_type_id: b1
    display_name: B1 (Site.pro Accounting)
    description: One company in B1 (Site.pro Accounting), reached with its API key.
    auth:
      type: static_secret
    config_schema:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 190
          title: Label
          description: Optional name for this connection, for example the company.
    secret_schema:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 8
          maxLength: 256
          pattern: "^[\\x21-\\x7e]+$"
          title: API key
          description: The API key from Settings → Integrations in Site.pro Accounting.
    capabilities:
      test_connection: true
