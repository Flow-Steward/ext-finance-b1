- operation_id: declaration_generations_generate_ffdata
  title: Generate a declaration file (FFData)
  fields:
  - name: templateId
    label: templateId
    widget_type: number
    required: true
    help_text: Declaration type ID. 6 - FR0600 (requires dateFrom, dateTill), 7 - GPM312 (requires year;
      optional addCurrentMonth, addPreviousMonth), 8 - GPM313 (requires year, month — one calendar month),
      9 - FR0564 (requires year, month — one calendar month; optional source), 10 - FR0600V3 (requires
      dateFrom, dateTill).
  - name: dateFrom
    label: dateFrom
    widget_type: text
    required: false
    help_text: 'Start date (inclusive), format: yyyy-MM-dd . Required for FR0600/FR0600V3. For FR0564/GPM313
      may replace year+month when it is an exact calendar month. For GPM312 may replace year when dateFrom
      is YYYY-01-01 .'
  - name: dateTill
    label: dateTill
    widget_type: text
    required: false
    help_text: 'End date (inclusive), format: yyyy-MM-dd . Required for FR0600/FR0600V3. For monthly forms
      must be the last day of the same month when used instead of year+month. For GPM312 may be YYYY-01-01
      or YYYY-12-31 of the same year.'
  - name: year
    label: year
    widget_type: number
    required: false
    help_text: Year. Required for GPM312/GPM313/FR0564 when not derived from dates.
  - name: month
    label: month
    widget_type: number
    required: false
    help_text: Month. Required for GPM313/FR0564 when not derived from dates.
  - name: addCurrentMonth
    label: addCurrentMonth
    widget_type: boolean
    required: false
    help_text: 'GPM312 only: include December of the selected year. Defaults to true (same as UI) when
      omitted.'
  - name: addPreviousMonth
    label: addPreviousMonth
    widget_type: boolean
    required: false
    help_text: 'GPM312 only: include December of the previous year. Defaults to false when omitted.'
  - name: source
    label: source
    widget_type: boolean
    required: false
    help_text: 'FR0564 only: generate from the sales register (including credit invoices).'
